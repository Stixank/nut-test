name: Build NUT for Windows x64 (Cypress 0665:5161)

on:
  push:
    branches:
      - test-cypress-0665-5161
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: x86_64-w64-mingw32
  PREFIX: /usr/x86_64-w64-mingw32

jobs:
  build-nutdrv-qx-win64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Install MinGW cross-build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git curl wget ca-certificates \
            mingw-w64 \
            autoconf automake libtool pkg-config \
            python3 python3-pygments \
            unzip zip xz-utils

      - name: Checkout NUT source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare generated build system
        run: |
          git config --global core.autocrlf input
          chmod +x autogen.sh
          ./autogen.sh

      - name: Build regex dependency (libgnurx)
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/nut-deps"
          cd "$RUNNER_TEMP/nut-deps"
          wget -nv --tries=5 --retry-connrefused -L \
            -O mingw-libgnurx-2.5.1-src.tar.gz \
            "https://downloads.sourceforge.net/project/mingw/Other/UserContributed/regex/mingw-regex-2.5.1/mingw-libgnurx-2.5.1-src.tar.gz"
          tar -xzf mingw-libgnurx-2.5.1-src.tar.gz
          cd mingw-libgnurx-2.5.1
          ./configure --prefix="$PREFIX" --host="$ARCH"
          make
          sudo make install
          # NUT configure searches for "-lregex": provide aliases if missing
          cd "$PREFIX/lib"
          for EXT in a dll.a; do
            if [ -f "libgnurx.$EXT" ] && [ ! -e "libregex.$EXT" ]; then
              sudo ln -s "libgnurx.$EXT" "libregex.$EXT"
            fi
          done
          ls -la "$PREFIX/include/regex.h" "$PREFIX"/lib/libgnurx* "$PREFIX"/lib/libregex* "$PREFIX"/bin/libgnurx*

      - name: Build libusb-1.0 dependency
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/nut-deps"
          wget -nv --tries=5 --retry-connrefused -L \
            -O libusb-1.0.26.tar.bz2 \
            "https://github.com/libusb/libusb/releases/download/v1.0.26/libusb-1.0.26.tar.bz2"
          tar -xjf libusb-1.0.26.tar.bz2
          cd libusb-1.0.26
          ./configure --prefix="$PREFIX" --host="$ARCH"
          make -j"$(nproc)"
          sudo make install
          test -f "$PREFIX/lib/libusb-1.0.dll.a"
          test -f "$PREFIX/lib/pkgconfig/libusb-1.0.pc"

      - name: Configure NUT (USB + serial, no optional extras)
        run: |
          set -euxo pipefail
          mkdir -p build-win64
          cd build-win64
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export CFLAGS="-D_POSIX=1 -D_POSIX_C_SOURCE=200112L -D_POSIX_THREAD_SAFE_FUNCTIONS=200112L -D_WIN32_WINNT=0xffff -I$PREFIX/include"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L$PREFIX/lib"
          ../configure \
            --host="$ARCH" \
            --build="$(gcc -dumpmachine)" \
            --prefix=/ \
            --with-all=no \
            --with-usb=yes \
            --with-serial=yes \
            --without-ssl \
            --without-doc \
            --without-systemdsystemunitdir \
            --without-nut-scanner \
            --without-libltdl

      - name: Build nutdrv_qx
        run: |
          set -euxo pipefail
          cd build-win64
          # Note: "--with-drivers=nutdrv_qx" is not used because on Windows
          # it drops $(EXEEXT) from the program name, so make is asked to
          # build "nutdrv_qx" instead of "nutdrv_qx.exe". Build the shared
          # libraries, then only the one driver target explicitly.
          make -j"$(nproc)" all-libs-local
          make -j"$(nproc)" -C drivers nutdrv_qx.exe
          find . -iname 'nutdrv_qx*.exe' -print

      - name: Verify and package nutdrv_qx for Windows x64
        run: |
          set -euxo pipefail
          OUT="$PWD/nutdrv_qx-win64"
          rm -rf "$OUT"
          mkdir -p "$OUT/bin"

          # Locate the real PE executable (not a libtool wrapper script)
          EXE=""
          for CAND in $(find build-win64 -iname 'nutdrv_qx.exe' -type f | sort); do
            if file "$CAND" | grep -q 'PE32+'; then EXE="$CAND"; break; fi
          done
          test -n "$EXE"
          cp -p "$EXE" "$OUT/bin/nutdrv_qx.exe"
          file "$OUT/bin/nutdrv_qx.exe"

          # Co-bundle required non-system DLLs (recursively)
          SEARCH_DIRS="$PREFIX/bin $PREFIX/lib $(ls -d /usr/lib/gcc/$ARCH/*/ 2>/dev/null | tr '\n' ' ')"
          bundle_deps() {
            for F in "$@"; do
              for DLL in $($ARCH-objdump -p "$F" | awk '/DLL Name:/ {print $3}'); do
                [ -e "$OUT/bin/$DLL" ] && continue
                for D in $SEARCH_DIRS; do
                  if [ -f "$D/$DLL" ]; then
                    cp -p "$D/$DLL" "$OUT/bin/"
                    bundle_deps "$OUT/bin/$DLL"
                    break
                  fi
                done
              done
            done
          }
          bundle_deps "$OUT/bin/nutdrv_qx.exe"

          echo "Imported DLLs of nutdrv_qx.exe:"
          $ARCH-objdump -p "$OUT/bin/nutdrv_qx.exe" | awk '/DLL Name:/ {print "  " $3}'
          echo "Bundled files:"
          ls -la "$OUT/bin"
          test -n "$(find "$OUT/bin" -iname 'libusb*.dll' -print -quit)"

          {
            echo "Commit: $(git rev-parse HEAD)"
            echo "Build: nutdrv_qx for Windows x64 (MinGW-w64 cross-build on ubuntu-22.04)"
            echo "Cypress fix: e999565a2edfc50177a9cf0018fed758371b7dfb"
          } > "$OUT/BUILD-INFO.txt"

          zip -r nutdrv_qx-win64.zip nutdrv_qx-win64
          unzip -l nutdrv_qx-win64.zip | grep -E 'bin/nutdrv_qx\.exe$'

      - name: Upload nutdrv_qx Windows x64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: nutdrv_qx-win64-cypress-0665-5161
          path: nutdrv_qx-win64.zip
          if-no-files-found: error
          retention-days: 14

  unit-test-cypress:
    # Native Linux run of the simulated 0665:5161 bridge unit test, which
    # cannot be executed in the Windows cross-build job above.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ca-certificates \
            autoconf automake libtool pkg-config \
            python3 python3-pygments \
            libusb-1.0-0-dev

      - name: Checkout NUT source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare generated build system
        run: |
          chmod +x autogen.sh
          ./autogen.sh

      - name: Configure NUT (USB + serial)
        run: |
          set -euxo pipefail
          mkdir -p build-linux
          cd build-linux
          ../configure \
            --with-all=no \
            --with-usb=yes \
            --with-serial=yes \
            --without-ssl \
            --without-doc \
            --without-nut-scanner

      - name: Build libraries and run nutdrv_qx_cypress_utest
        run: |
          set -euxo pipefail
          cd build-linux
          make -j"$(nproc)" all-libs-local
          make -C tests check TESTS=nutdrv_qx_cypress_utest || {
            cat tests/nutdrv_qx_cypress_utest.log || true
            exit 1
          }
          cat tests/nutdrv_qx_cypress_utest.log
